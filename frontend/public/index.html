<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
    <style>
      /* Avatar styles for comments */
      .comment-avatar img, .comment-input-wrapper img {
        width: 24px !important;
        height: 24px !important;
        border-radius: 50% !important;
        object-fit: cover !important;
      }
      
      .avatar-placeholder {
        width: 24px !important;
        height: 24px !important;
        border-radius: 50% !important;
        background: linear-gradient(135deg, #8b5cf6, #f472b6) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        color: white !important;
        font-size: 12px !important;
        font-weight: bold !important;
      }

      /* Set default font to Inter */
      body {
        font-family: 'Inter', sans-serif;
      }

      /* Tailwind Configuration */
      :root {
        --color-primary: #0ea5e9;         /* Sky Blue */
        --color-primary-light: #7dd3fc;   /* Light Sky Blue */
        --color-primary-dark: #0284c7;    /* Dark Sky Blue */
        --color-secondary: #10b981;       /* Emerald Green */
        --color-accent: #f97316;          /* Orange */
        --color-background: #f8fafc;      /* Slate 50 */
        --color-card-bg: #ffffff;         /* White */
        --color-text: #1e293b;            /* Slate 800 */
        --color-text-muted: #64748b;      /* Slate 500 */
        --color-border: #e2e8f0;          /* Slate 200 */
      }

      /* Dark mode colors */
      @media (prefers-color-scheme: dark) {
        :root {
          --color-background: #0f172a;    /* Slate 900 */
          --color-card-bg: #1e293b;       /* Slate 800 */
          --color-text: #f1f5f9;          /* Slate 100 */
          --color-text-muted: #94a3b8;    /* Slate 400 */
          --color-border: #334155;        /* Slate 700 */
        }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              'primary-light': 'var(--color-primary-light)',
              'primary-dark': 'var(--color-primary-dark)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              background: 'var(--color-background)',
              'card-bg': 'var(--color-card-bg)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
